name = Net-OpenSSH-More
version = 1.07
author = George S. Baugh <george@troglodyne.net>
license = MIT
copyright_holder = George S. Baugh
copyright_year = 2026

[GatherDir]
include_dotfiles = 1
exclude_filename = LICENSE
exclude_match = .*\.swp
exclude_match = .*\.swo
exclude_match = .*\swn

[PruneCruft]
except = ^\.perlcriticrc$
except = ^\.preferred_modules\.ini$
except = ^\.pod_stopwords$

[ManifestSkip]
[MetaYAML]
[MetaJSON]
[License]
[Readme]
[ExtraTests]
[ExecDir]
[ShareDir]
[MakeMaker]
[Manifest]

[PkgVersion]
use_package = 1
[AutoPrereqs]
[MetaProvides::Package]

[PodWeaver]

[FileFinder::ByName]
dir = lib
match = \.pm$

[Git::Contributors]

[@TestingMania]
critic_config = .perlcriticrc
disable = Test::Portability

; The dist ships .preferred_modules.ini for the critic test, and its name has
; two dots.
[Test::Portability]
options = test_one_dot = 0

[TestRelease]
[ConfirmRelease]
[UploadToCPAN]

[CheckMetaResources]
[CheckPrereqsIndexed]
[CheckChangesHasContent]

[Prereqs / RuntimeRequires]
perl = 5.020
Moo = 1.005
List::Util = 1.33

[GithubMeta]
issues = 1

[Encoding]
filename = t/www/icon.gif
filename = t/www/invalid-extension.xpi
filename = t/www/redisplay.xpi
encoding = bytes

; `dzil authordeps` doesn't know about the Pod Weaver dependenciess:
; authordep Pod::Weaver::Section::Contributors = 0
; authordep Pod::Weaver::Plugin::Encoding = 0
; authordep Pod::Weaver::Section::SeeAlso = 0
; authordep Pod::Weaver::Section::GenerateSection = 0
; authordep Pod::Elemental::Transformer::List = 0
; authordep Test::Pod::Coverage = 0
; authordep Term::UI = 0
